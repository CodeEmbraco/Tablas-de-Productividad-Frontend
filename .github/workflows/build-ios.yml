name: Build & Upload Signed iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - feature/PWA

jobs:
  build-and-upload-ipa:
    name: Build, Sign & Upload iOS (.ipa) to App Store Connect
    runs-on: macos-15-intel

    defaults:
      run:
        working-directory: FrontEnd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create .env file for production build
        run: |
          echo "VITE_LOCAL_BACKEND_URL=${{ secrets.VITE_LOCAL_BACKEND_URL || 'https://api.embraco.com/remx/receipes/productividad' }}" > .env
          echo "VITE_API_KEY=${{ secrets.VITE_API_KEY || '3ce62d43fbb5b5b09a16996f62395d' }}" >> .env
          echo "VITE_ADMIN_USERNAME=${{ secrets.VITE_ADMIN_USERNAME || 'admin' }}" >> .env
          echo "VITE_ADMIN_PASSWORD=${{ secrets.VITE_ADMIN_PASSWORD || 'Nidec@2026' }}" >> .env

      - name: Install NPM dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets (Vite)
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Prepare API Key & Provision Ephemeral Distribution Certificate
        env:
          RAW_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          RAW_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          RAW_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          # 1. Crear Keychain temporal para Xcode codesign
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="ci_temp_pass_123"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # Instalar certificados intermedios WWDR de Apple (G2 y G3)
          curl -sL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          curl -sL -o "$RUNNER_TEMP/AppleWWDRCAG2.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG2.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          security import "$RUNNER_TEMP/AppleWWDRCAG2.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true

          # 2. Generar llave privada RSA + CSR con OpenSSL
          openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/dist.key" \
            -out "$RUNNER_TEMP/dist.csr" \
            -subj "/CN=Nidec CI Distribution/O=Nidec Global Appliance Mexico/C=MX"

          # 3. Normalizar API Key (.p8), validar JWT y crear certificado de distribución usando Node.js 22 nativo
          node - << 'NODEEOF'
          const fs = require('fs');
          const path = require('path');
          const os = require('os');
          const crypto = require('crypto');

          let keyId = (process.env.RAW_KEY_ID || '').replace(/\s+/g, '');
          let issuerId = (process.env.RAW_ISSUER_ID || '').replace(/\s+/g, '');
          let rawKey = (process.env.RAW_PRIVATE_KEY || '').trim();

          if (!keyId || !issuerId || !rawKey) {
            console.error('❌ Error: Faltan los secrets APPSTORE_KEY_ID, APPSTORE_ISSUER_ID o APPSTORE_PRIVATE_KEY.');
            process.exit(1);
          }

          // Detectar si accidentalmente se invirtieron KEY_ID (10 chars) e ISSUER_ID (UUID de 36 chars)
          if (keyId.includes('-') && !issuerId.includes('-')) {
            console.log('🔄 Detectado KEY_ID e ISSUER_ID invertidos; corrigiendo orden automáticamente...');
            const tmp = keyId;
            keyId = issuerId;
            issuerId = tmp;
          }

          console.log(`ℹ️ Key ID longitud: ${keyId.length} chars | Issuer ID longitud: ${issuerId.length} chars`);

          // Reconstruir formato PEM válido para el archivo .p8
          const bodyBase64 = rawKey
            .replace(/-----BEGIN PRIVATE KEY-----/g, '')
            .replace(/-----END PRIVATE KEY-----/g, '')
            .replace(/\s+/g, '');
          const wrappedLines = bodyBase64.match(/.{1,64}/g) || [];
          const cleanPem = `-----BEGIN PRIVATE KEY-----\n${wrappedLines.join('\n')}\n-----END PRIVATE KEY-----\n`;

          const keyDir = path.join(os.homedir(), '.appstoreconnect', 'private_keys');
          fs.mkdirSync(keyDir, { recursive: true });
          const keyPath = path.join(keyDir, `AuthKey_${keyId}.p8`);
          fs.writeFileSync(keyPath, cleanPem, { mode: 0o600 });

          // Exportar variables limpias a GITHUB_ENV
          fs.appendFileSync(process.env.GITHUB_ENV, `CLEAN_KEY_ID=${keyId}\nCLEAN_ISSUER_ID=${issuerId}\nKEY_PATH=${keyPath}\n`);

          // Crear JWT ES256 para App Store Connect API
          const base64url = (buf) => Buffer.from(buf).toString('base64').replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
          const now = Math.floor(Date.now() / 1000);
          const header = base64url(JSON.stringify({ alg: 'ES256', kid: keyId, typ: 'JWT' }));
          const payload = base64url(JSON.stringify({ iss: issuerId, iat: now - 60, exp: now + 900, aud: 'appstoreconnect-v1' }));
          const signingInput = `${header}.${payload}`;
          const signature = crypto.sign('sha256', Buffer.from(signingInput), {
            key: cleanPem,
            dsaEncoding: 'ieee-p1363'
          });
          const token = `${signingInput}.${base64url(signature)}`;

          const csrPem = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'dist.csr'), 'utf8');
          const csrContent = csrPem
            .split(/\r?\n/)
            .filter((l) => !l.startsWith('-----') && l.trim().length > 0)
            .join('');

          (async () => {
            const headers = {
              Authorization: `Bearer ${token}`,
              'Content-Type': 'application/json'
            };

            for (const certType of ['DISTRIBUTION', 'IOS_DISTRIBUTION']) {
              const res = await fetch('https://api.appstoreconnect.apple.com/v1/certificates', {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  data: {
                    type: 'certificates',
                    attributes: {
                      certificateType: certType,
                      csrContent
                    }
                  }
                })
              });

              const text = await res.text();
              if (res.ok) {
                const json = JSON.parse(text);
                const certId = json.data.id;
                const certDer = Buffer.from(json.data.attributes.certificateContent, 'base64');
                fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'dist.cer'), certDer);
                fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'ci_cert_id.txt'), certId);
                console.log(`✅ Certificado de distribución creado (${certType}): ID=${certId}`);
                return;
              } else {
                console.log(`⚠️ Intento ${certType} respondió HTTP ${res.status}: ${text}`);
              }
            }

            console.error('❌ No se pudo crear un certificado nuevo (posible límite de certificados alcanzado o permisos de API Key).');
            process.exit(1);
          })();
          NODEEOF

          # 4. Convertir .cer + .key a .p12 (compatible con LibreSSL y OpenSSL 3) e importar al Keychain temporal
          openssl x509 -inform DER -in "$RUNNER_TEMP/dist.cer" -out "$RUNNER_TEMP/dist.pem"
          openssl pkcs12 -export \
            -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1 \
            -out "$RUNNER_TEMP/dist.p12" \
            -inkey "$RUNNER_TEMP/dist.key" \
            -in "$RUNNER_TEMP/dist.pem" \
            -passout pass:"$KEYCHAIN_PASS" || \
          openssl pkcs12 -export \
            -out "$RUNNER_TEMP/dist.p12" \
            -inkey "$RUNNER_TEMP/dist.key" \
            -in "$RUNNER_TEMP/dist.pem" \
            -passout pass:"$KEYCHAIN_PASS"

          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN_PATH" -P "$KEYCHAIN_PASS" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Configure Team ID (AWHLUTHF5F), Build Number & Export Compliance
        working-directory: FrontEnd/ios/App
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = 1;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.tablas.productividad;/PRODUCT_BUNDLE_IDENTIFIER = com.tablas.productividad; DEVELOPMENT_TEAM = AWHLUTHF5F;/g" App.xcodeproj/project.pbxproj

          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" App/Info.plist

      - name: Resolve Swift Package Manager dependencies
        working-directory: FrontEnd/ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Build Xcode Archive (.xcarchive)
        working-directory: FrontEnd/ios/App
        run: |
          xcodebuild clean archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM=AWHLUTHF5F \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Export & Sign IPA
        working-directory: FrontEnd/ios/App
        run: |
          cat << 'EOF' > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>AWHLUTHF5F</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>destination</key>
              <string>export</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$CLEAN_KEY_ID" \
            -authenticationKeyIssuerID "$CLEAN_ISSUER_ID"

      - name: Upload Signed IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: TablasDeProductividad-signed-ipa
          path: FrontEnd/ios/App/build/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed IPA to App Store Connect (TestFlight)
        working-directory: FrontEnd/ios/App
        run: |
          IPA_FILE=$(ls build/export/*.ipa | head -n 1)
          echo "🚀 Subiendo $IPA_FILE a App Store Connect..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$CLEAN_KEY_ID" \
            --apiIssuer "$CLEAN_ISSUER_ID"

      - name: Cleanup Ephemeral CI Certificate in Apple Portal
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ci_cert_id.txt" ]; then
            node - << 'NODEEOF'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const keyId = process.env.CLEAN_KEY_ID;
          const issuerId = process.env.CLEAN_ISSUER_ID;
          const keyPath = process.env.KEY_PATH;
          const certId = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'ci_cert_id.txt'), 'utf8').trim();
          const cleanPem = fs.readFileSync(keyPath, 'utf8');

          const base64url = (buf) => Buffer.from(buf).toString('base64').replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
          const now = Math.floor(Date.now() / 1000);
          const header = base64url(JSON.stringify({ alg: 'ES256', kid: keyId, typ: 'JWT' }));
          const payload = base64url(JSON.stringify({ iss: issuerId, iat: now - 60, exp: now + 600, aud: 'appstoreconnect-v1' }));
          const signingInput = `${header}.${payload}`;
          const signature = crypto.sign('sha256', Buffer.from(signingInput), { key: cleanPem, dsaEncoding: 'ieee-p1363' });
          const token = `${signingInput}.${base64url(signature)}`;

          fetch(`https://api.appstoreconnect.apple.com/v1/certificates/${certId}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` }
          }).then((r) => console.log(`🧹 Certificado temporal ${certId} eliminado (HTTP ${r.status})`));
          NODEEOF
          fi
